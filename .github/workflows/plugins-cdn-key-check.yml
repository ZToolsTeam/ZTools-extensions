# 发布密钥检查：只能手动运行，实测 plugins-cdn 环境里的 OSS / CDN 凭证，不发布任何插件
# 新配或更换 AccessKey 后在 Actions 页手动运行一次
name: 发布密钥检查

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 检查 OSS / CDN 凭证
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: plugins-cdn
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 实测上传、读取、刷新 CDN 与权限范围
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          CDN_ACCESS_KEY_ID: ${{ secrets.CDN_ACCESS_KEY_ID }}
          CDN_ACCESS_KEY_SECRET: ${{ secrets.CDN_ACCESS_KEY_SECRET }}
        run: node scripts/check-cdn-credentials.mjs
