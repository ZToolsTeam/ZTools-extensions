<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#globeGrad)"/>
  <!-- Globe Circle -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#ffffff" stroke-width="4"/>
  <!-- Latitude / Longitude lines -->
  <ellipse cx="50" cy="50" rx="16" ry="30" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="3 3"/>
  <line x1="20" y1="50" x2="80" y2="50" stroke="#ffffff" stroke-width="3"/>
  <!-- Clock hands -->
  <polyline points="50,34 50,50 62,50" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="50" cy="50" r="3" fill="#ffffff"/>
</svg>
