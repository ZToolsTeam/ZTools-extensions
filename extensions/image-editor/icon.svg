<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="editGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#editGrad)"/>
  <!-- Image boundary with dashed crop effect -->
  <rect x="20" y="20" width="60" height="60" rx="8" fill="#ffffff" opacity="0.15"/>
  <rect x="24" y="24" width="52" height="52" rx="4" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 3" opacity="0.9"/>
  <!-- Rotate arrow -->
  <path d="M68 28 A 20 20 0 0 0 32 28" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="32,24 28,32 36,32" fill="#38bdf8"/>
  <!-- Watermark text symbol 'T' -->
  <text x="44" y="58" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" opacity="0.95">T</text>
  <!-- Magic edit sparkles -->
  <circle cx="68" cy="64" r="3" fill="#facc15"/>
  <circle cx="62" cy="72" r="2" fill="#facc15"/>
  <circle cx="72" cy="74" r="2.5" fill="#facc15"/>
